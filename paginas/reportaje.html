<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Reportaje - Diálogo y Desarrollo Perú</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Cabin:400,500,600&subset=latin-ext,vietnamese" rel="stylesheet">

    <!-- Estilos del sitio -->
    <link rel="stylesheet" href="../assets/web/css/style-starter.css">
    <link rel="stylesheet" href="../assets/web/css/ajustes.css">
</head>

<body>

    <!-- Cabecera compartida -->
    <div id="header-container"></div>

    <main id="contenido">

        <!-- Migas de pan -->
        <section class="breadcrumb-area py-sm-5 py-4">
            <div class="container py-2">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h2 class="title-big mb-md-0">Reportajes</h2>
                    </div>
                    <div class="col-md-6">
                        <ul class="breadcrumb justify-content-md-end mb-0">
                            <li> <a href="../index.html">Inicio</a> </li>
                            <li class="active"><a href="reportajes.html">Reportajes</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- Contenido del reportaje -->
        <section class="py-5">
            <div class="container">

                <div id="estado-reportaje" class="text-center py-5">
                    <p>Cargando reportaje...</p>
                </div>

                <div class="row" id="contenido-reportaje" hidden>

                    <!-- Artículo principal -->
                    <div class="col-lg-8 col-md-12">

                        <article class="blog-post">

                            <div class="mb-3">
                                <span id="fecha-reportaje"></span>
                                <span class="mx-2">|</span>
                                <span id="autor-reportaje"></span>
                            </div>

                            <h1 class="title-big mb-4" id="titulo-reportaje"></h1>

                            <div class="mb-4 text-center" id="contenedor-foto-principal">
                                <img
                                    id="foto-principal"
                                    class="img-fluid"
                                    src="../assets/web/img/placeholder.jpg"
                                    alt="Imagen principal del reportaje">
                            </div>

                            <blockquote id="resumen-reportaje" class="blockquote text-center"></blockquote>

                            <div id="desarrollo-reportaje" class="mt-4"></div>

                            <!-- Galería de fotografías -->
                            <section id="seccion-galeria" class="mt-5" hidden>
                                <h3 class="title-big mb-4">Galería de fotografías</h3>
                                <div class="row" id="galeria-reportaje"></div>
                            </section>

                            <!-- Documento PDF adjunto -->
                            <section id="seccion-pdf" class="mt-4" hidden>
                                <h3 class="title-big mb-3">Documento adjunto</h3>
                                <a
                                    id="enlace-pdf"
                                    class="btn btn-style btn-primary mt-4"
                                    href="#"
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    <span class="fa fa-download" aria-hidden="true"></span>
                                    &nbsp;&nbsp;Descargar PDF adjunto
                                </a>
                            </section>

                            <div class="mt-5">
                                <a href="reportajes.html" class="btn btn-style btn-primary">
                                    <span class="fa fa-arrow-left" aria-hidden="true"></span>
                                    &nbsp;&nbsp;&nbsp;Volver a reportajes
                                </a>
                            </div>

                        </article>
                    </div>

                    <!-- Barra lateral -->
                    <aside class="col-lg-4 col-md-12 mt-5 mt-lg-0">

                        <div class="sidebar-widget mb-5">
                            <h3 class="title-big mb-4">Últimos reportajes</h3>
                            <ul id="ultimos-reportajes" class="list-unstyled">
                                <li>Cargando reportajes...</li>
                            </ul>
                        </div>

                        <div class="sidebar-widget">
                            <h3 class="title-big mb-4">Archivos</h3>
                            <ul id="archivos-reportajes" class="list-unstyled">
                                <li>Cargando archivos...</li>
                            </ul>
                        </div>

                    </aside>

                </div>

            </div>
        </section>

    </main>

    <!-- Pie de página compartido -->
    <div id="footer-container"></div>

    <!-- Scripts del sitio -->
    <script src="../assets/web/js/jquery-3.3.1.min.js"></script>
    <script src="../assets/web/js/theme-change.js"></script>
    <script src="../assets/web/js/easyResponsiveTabs.js"></script>
    <script src="../assets/web/js/owl.carousel.js"></script>
    <script src="../assets/web/js/jquery.magnific-popup.min.js"></script>
    <script src="../assets/web/js/bootstrap.min.js"></script>

    <!-- Cargadores compartidos -->
    <script src="../assets/web/js/header-loader.js"></script>
    <script src="../assets/web/js/footer-loader.js"></script>

    <!-- Datos del reportaje -->
    <script src="../assets/web/js/reportaje-api.js"></script>

</body>
</html>
